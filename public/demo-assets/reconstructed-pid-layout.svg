    <path d="M585 405 H492 V326 H345 V254 H54" class="pipe" marker-end="url(#arrowLeft)"/>
    <path d="M418 693 V742 H242" class="pipe"/>
    <path d="M418 693 V742 H526" class="pipe"/>
