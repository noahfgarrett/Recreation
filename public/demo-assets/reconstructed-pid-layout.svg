    <path d="M54 646 H196 L230 617 H414 L450 646 H585" class="pipe" marker-start="url(#arrowLeft)"/>
    <path d="M775 252 H1244 V154 H1546" class="pipe" marker-end="url(#arrow)"/>
    <path d="M775 342 H884" class="pipe"/>
    <path d="M1012 342 H1072" class="pipe"/>
    <path d="M1200 342 H1329 V476 H1546" class="pipe" marker-end="url(#arrow)"/>
