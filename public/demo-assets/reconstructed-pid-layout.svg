<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 1 L16 7 L2 13 Z" fill="#25313f"/>
    </marker>
    <marker id="arrowLeft" markerWidth="18" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M16 1 L2 7 L16 13 Z" fill="#25313f"/>
    </marker>
    <style>
      .pipe { fill: none; stroke: #25313f; stroke-width: 3; stroke-linecap: square; stroke-linejoin: round; }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 8; }
      .equip { fill: #ffffff; stroke: #25313f; stroke-width: 3; }
      .node { fill: #fff8ec; stroke: #b7791f; stroke-width: 2.5; }
      .matched { fill: #ecfdf7; stroke: #109176; stroke-width: 2.5; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
      .label { fill: #17212f; font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #475569; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .tiny { fill: #607084; font-family: Arial, sans-serif; font-size: 12px; }
      .green { fill: #109176; }
      .amber { fill: #b7791f; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="54" y="52" width="1492" height="782" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.4"/>
  <g opacity="0.55">
    <path d="M54 172 H1546 M54 292 H1546 M54 412 H1546 M54 532 H1546 M54 652 H1546 M54 772 H1546" stroke="#e9eef5"/>
    <path d="M172 52 V834 M292 52 V834 M412 52 V834 M532 52 V834 M652 52 V834 M772 52 V834 M892 52 V834 M1012 52 V834 M1132 52 V834 M1252 52 V834 M1372 52 V834 M1492 52 V834" stroke="#e9eef5"/>
  </g>

  <text x="88" y="94" class="label">RECREATED P&amp;ID-LIKE LAYOUT</text>
  <text x="88" y="121" class="tiny">Spatial reconstruction keeps equipment, pipes, and off-page continuations near their drawing context.</text>

