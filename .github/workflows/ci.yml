name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Point PyMuPDF at the Tesseract language data
        run: echo "TESSDATA_PREFIX=$(dirname "$(dpkg -L tesseract-ocr-eng | grep 'eng.traineddata$')")" >> "$GITHUB_ENV"
      - run: pip install -r backend/requirements.txt
      - run: python backend/run_tests.py
