[package]
name = "recreation"
version = "0.1.0"
description = "Offline P&ID reconstruction workspace"
authors = ["Recreation"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
